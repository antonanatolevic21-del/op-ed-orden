name: One-off first-user test fixes

on:
  push:
    paths:
      - '.github/workflows/oneoff-first-user-test-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Back up current files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p backups
          cp sw-register.js backups/sw-register-before-first-user-test-2026-07-25.js
          cp index.html backups/index-before-first-user-test-2026-07-25.html
          cp active-filter-chips.js backups/active-filter-chips-before-first-user-test-2026-07-25.js
          cp quality-center.js backups/quality-center-before-first-user-test-2026-07-25.js
          cp events-app.js backups/events-app-before-first-user-test-2026-07-25.js
          cp events-bootstrap.js backups/events-bootstrap-before-first-user-test-2026-07-25.js
          cp events.html backups/events-before-first-user-test-2026-07-25.html
          git add backups/sw-register-before-first-user-test-2026-07-25.js \
            backups/index-before-first-user-test-2026-07-25.html \
            backups/active-filter-chips-before-first-user-test-2026-07-25.js \
            backups/quality-center-before-first-user-test-2026-07-25.js \
            backups/events-app-before-first-user-test-2026-07-25.js \
            backups/events-bootstrap-before-first-user-test-2026-07-25.js \
            backups/events-before-first-user-test-2026-07-25.html
          git commit -m "Back up files before first-user test fixes"
          git push origin HEAD:main

      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing marker in {label}: {old}')
              return text.replace(old, new, 1)

          sw_path = Path('sw-register.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = replace_once(sw,
              "const primaryVersion = '20260725-primary-shell7';",
              "const primaryVersion = '20260725-primary-shell8';",
              'sw-register.js')
          sw = replace_once(sw,
              "const adminMissingVersion = '20260725-admin-missing2';",
              "const adminMissingVersion = '20260725-admin-missing2';\n  const firstUserFixVersion = '20260725-first-user-test1';\n  const top100DragVersion = '20260725-top100-drag1';",
              'sw-register.js')
          sw = replace_once(sw,
              "initialStylePromises.push(addStyle('admin-missing-inline.css', adminMissingVersion));",
              "initialStylePromises.push(addStyle('admin-missing-inline.css', adminMissingVersion));\n  initialStylePromises.push(addStyle('first-user-test-fixes.css', firstUserFixVersion));",
              'sw-register.js')
          sw = replace_once(sw,
              "['account-sync.js', accountSyncVersion],",
              "['account-sync.js', accountSyncVersion],\n    ['first-user-test-fixes.js', firstUserFixVersion],",
              'sw-register.js')
          sw = replace_once(sw,
              "addStyle('top100-suite.css', top100SuiteVersion);",
              "addStyle('top100-suite.css', top100SuiteVersion);\n    addStyle('top100-drag.css', top100DragVersion);",
              'sw-register.js')
          sw = replace_once(sw,
              "['manual-top-insert-fix.js', manualTopInsertFixVersion]",
              "['manual-top-insert-fix.js', manualTopInsertFixVersion],\n      ['top100-drag.js', top100DragVersion]",
              'sw-register.js')
          sw = replace_once(sw,
              "./sw.js?v=20260725-force52",
              "./sw.js?v=20260725-force53",
              'sw-register.js')
          sw_path.write_text(sw, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = replace_once(index,
              'sw-register.js?v=20260725-admin-missing1',
              'sw-register.js?v=20260725-first-user-test1',
              'index.html')
          index_path.write_text(index, encoding='utf-8')

          chips_path = Path('active-filter-chips.js')
          chips = chips_path.read_text(encoding='utf-8')
          old_period = """        if (fromYear) fromYear.value = '';
        if (toYear) toYear.value = '';
        if (fromSeason) fromSeason.value = 'winter';
        if (toSeason) toSeason.value = 'fall';
        fire(fromYear);
        fire(toYear);
        fire(fromSeason);
        fire(toSeason);"""
          new_period = """        if (fromYear) { fromYear.value = ''; fire(fromYear); }
        if (toYear) { toYear.value = ''; fire(toYear); }
        if (fromSeason) { fromSeason.value = 'winter'; fire(fromSeason); }
        if (toSeason) { toSeason.value = 'fall'; fire(toSeason); }"""
          chips = replace_once(chips, old_period, new_period, 'active-filter-chips.js')
          chips_path.write_text(chips, encoding='utf-8')

          quality_path = Path('quality-center.js')
          quality = quality_path.read_text(encoding='utf-8')
          quality = replace_once(quality,
              """  function syncTriggerVisibility() {
    if (triggerButton) triggerButton.hidden = !isAdminUi();
  }""",
              """  function syncTriggerVisibility() {
    if (!triggerButton) return;
    triggerButton.hidden = false;
    triggerButton.title = isAdminUi() ? 'Открыть центр качества базы' : 'Открыть центр качества базы';
  }""",
              'quality-center.js')
          quality = replace_once(quality,
              "triggerButton.addEventListener('click', () => { void openQualityCenter(false); });",
              """triggerButton.addEventListener('click', () => {
      if (isAdminUi()) {
        void openQualityCenter(false);
        return;
      }
      window.location.assign('https://www.youtube.com/watch?v=dQw4w9WgXcQ');
    });""",
              'quality-center.js')
          quality_path.write_text(quality, encoding='utf-8')

          events_app_path = Path('events-app.js')
          events_app = events_app_path.read_text(encoding='utf-8')
          events_app = replace_once(events_app,
              "accessBadge.textContent = isAdmin() ? 'админ' : isUser() ? 'участник' : isGuest() ? `${isAdminPreview ? 'просмотр · ' : ''}гость #${String(guestSlot).padStart(2, '0')}` : 'вход не выполнен';",
              "accessBadge.textContent = isAdmin() ? 'админ' : isUser() ? 'пользователь' : isGuest() ? `${isAdminPreview ? 'просмотр · ' : ''}гость #${String(guestSlot).padStart(2, '0')}` : 'вход не выполнен';",
              'events-app.js')
          events_app = replace_once(events_app,
              "renderEventRoomBrowser('bestworst', 'Угадай лучшее / худшее', 'Параллельные игровые комнаты.', bestWorstRooms, isAdmin());",
              "renderEventRoomBrowser('bestworst', 'Угадай лучшее / худшее', 'Параллельные игровые комнаты.', bestWorstRooms, isUser() || isAdmin());",
              'events-app.js')
          events_app = replace_once(events_app,
              "renderEventRoomBrowser('codenames', 'Codenames по OP/ED', 'Командные игры идут независимо друг от друга.', codenamesRooms, isAdmin());",
              "renderEventRoomBrowser('codenames', 'Codenames по OP/ED', 'Командные игры идут независимо друг от друга.', codenamesRooms, isUser() || isAdmin());",
              'events-app.js')
          events_app_path.write_text(events_app, encoding='utf-8')

          bootstrap_path = Path('events-bootstrap.js')
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          bootstrap = replace_once(bootstrap,
              "./events-app.js?v=20260725-events-full2",
              "./events-app.js?v=20260725-events-full3",
              'events-bootstrap.js')
          bootstrap_path.write_text(bootstrap, encoding='utf-8')

          events_html_path = Path('events.html')
          events_html = events_html_path.read_text(encoding='utf-8')
          events_html = replace_once(events_html,
              'events-bootstrap.js?v=20260725-participant-suite3',
              'events-bootstrap.js?v=20260725-participant-suite4',
              'events.html')
          events_html_path.write_text(events_html, encoding='utf-8')
          PY

          git add sw-register.js index.html active-filter-chips.js quality-center.js events-app.js events-bootstrap.js events.html
          git commit -m "Apply first-user test UX fixes"
          git push origin HEAD:main
