name: One-off progressive shell patch

on:
  push:
    paths:
      - '.github/workflows/oneoff-progressive-shell.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-background-load-fix
          fetch-depth: 0
      - name: Patch index loader versions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('<html lang="ru" class="oc-primary-booting">', '<html lang="ru" class="oc-primary-ready oc-primary-progressive">'),
              ('index.css?v=20260725-first-paint2', 'index.css?v=20260726-progressive1'),
              ('sw-register.js?v=20260725-admin-missing1', 'sw-register.js?v=20260726-progressive1'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing index marker: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git add index.html
          git commit -m "Start the shell immediately and load data in background"
          git push origin HEAD:tmp-background-load-fix
