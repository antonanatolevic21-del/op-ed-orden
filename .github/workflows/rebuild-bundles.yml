name: Rebuild generated bundles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-bundles-main
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Commit generated bundles when sources changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add primary-enhancements.js primary-enhancements.css profile-enhancements.js profile-enhancements.css entity-enhancements.js entity-enhancements.css admin-enhancements.js admin-enhancements.css
          git commit -m "Rebuild generated frontend bundles"
          git push
