name: Refresh catalog snapshot

on:
  workflow_dispatch:
  schedule:
    # After the free Firestore quota resets at midnight Pacific (07–08 UTC).
    - cron: '17 9 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-catalog-snapshot.mjs
        env:
          # Compute shared averages once per day, not once per visitor.
          REBUILD_AGGREGATES_FROM_RATINGS: '1'
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.snapshot.json rating-aggregates.snapshot.json
          git diff --cached --quiet || git commit -m "Refresh catalog snapshot"
          git push

