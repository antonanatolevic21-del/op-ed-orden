<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Пикуко — инструменты</title>
  <style>
    :root { color-scheme: light dark; }
    body { width: 320px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 17px; }
    h2 { margin: 0; font-size: 15px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
    input { width: 18px; height: 18px; margin: 0; flex-shrink: 0; accent-color: #7a58d1; }
    p { margin: 6px 0 0; font-size: 13px; line-height: 1.45; }
    .page-options label { margin-top: 10px; }
    section { margin-top: 16px; padding-top: 14px; border-top: 1px solid color-mix(in srgb, currentColor 24%, transparent); }
    #test-presets { margin-top: 10px; }
    details { border-radius: 8px; background: color-mix(in srgb, currentColor 7%, transparent); }
    details + details { margin-top: 6px; }
    summary { padding: 9px 10px; cursor: pointer; font-weight: 600; }
    .count { float: right; margin-left: 8px; font-variant-numeric: tabular-nums; font-weight: 400; }
    details label { padding: 7px 10px; font-weight: 400; }
    details label:first-of-type { border-top: 1px solid color-mix(in srgb, currentColor 16%, transparent); }
    [role="status"]:empty { display: none; }
  </style>
  <script src="popup.js" defer></script>
  <script src="test-presets.js" defer></script>
  <script src="popup-test-presets.js" defer></script>
</head>
<body>
  <h1>Пикуко — инструменты</h1>
  <label>
    Вставка с абзацами
    <input id="paste-with-paragraphs" type="checkbox" data-setting="pasteWithParagraphs" aria-describedby="description" checked disabled>
  </label>
  <p id="description">Сохраняет переносы и пустые строки внутри одного текстового блока.</p>
  <section class="page-options" aria-labelledby="page-options-title">
    <h2 id="page-options-title">Настройки страницы</h2>
    <label>
      Пропускать заставку
      <input type="checkbox" data-setting="skipIntro" aria-describedby="page-options-description" disabled>
    </label>
    <label>
      Убирать текстовые лимиты
      <input type="checkbox" data-setting="removeTextLimits" aria-describedby="page-options-description" disabled>
    </label>
    <label>
      Показывать кнопку «Посмотреть карточку»
      <input type="checkbox" data-setting="viewUnfinishedTestCard" aria-describedby="page-options-description" checked disabled>
    </label>
    <label>
      Показывать подписки в тестах
      <input type="checkbox" data-setting="enableFollowingFeed" aria-describedby="page-options-description" checked disabled>
    </label>
    <p id="page-options-description">Вступают в силу после обновления вкладки Пикуко.</p>
  </section>
  <p id="status" role="status"></p>
  <section aria-labelledby="test-presets-title">
    <h2 id="test-presets-title">Автонастройки новых тестов</h2>
    <p>Отметь нужные пункты. Они сработают при открытии нового теста выбранного формата.</p>
    <div id="test-presets"></div>
    <p id="test-presets-status" role="status"></p>
  </section>
</body>
</html>
